<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Agenda DF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://chiicones.github.io/theme/css/style.css">
<style>
.blog-wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
}
.blog-header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 1rem;
    margin-bottom: 3rem;
}
.blog-header h1 {
    font-family: var(--ff-display);
    font-size: 2.5rem;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0;
}
.blog-header p {
    font-size: 0.85rem;
    color: var(--ink-light);
    margin-top: 0.4rem;
}
.blog-post {
    padding: 2rem 0;
    border-bottom: 1px solid var(--border-light);
}
.blog-post:last-of-type {
    border-bottom: none;
}
.blog-post__meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
}
.blog-post__cat {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
}
.blog-post__date {
    font-size: 0.72rem;
    color: var(--ink-light);
}
.blog-post__title {
    font-family: var(--ff-display);
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 0.75rem;
}
.blog-post__title a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
}
.blog-post__title a:hover {
    color: var(--gold);
    border-color: var(--gold-pale);
}
.blog-post__intro {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--ink-mid, #3a3530);
    margin-bottom: 1rem;
}
.blog-post__leia-mais {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 1px;
    transition: color 0.2s, border-color 0.2s;
}
.blog-post__leia-mais:hover {
    color: var(--gold);
    border-color: var(--gold);
}
.blog-post__leia-mais::after {
    content: ' →';
}
.blog-pagination {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border-light);
}
.blog-pagination a {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1px;
}
.blog-pagination a:hover { color: var(--gold); border-color: var(--gold); }
</style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="https://chiicones.github.io/" class="site-logo">
                <span class="logo-mark">✦</span>
                <span class="site-name">Agenda DF</span>
            </a>
            <nav class="main-nav">
                    <a href="/">Eventos</a>
                    <a href="/agenda.html">Agenda</a>
                    <a href="/mapa.html">Mapa</a>
                    <a href="/blog.html">Blog</a>
                    <a href="/pages/sobre.html">Sobre</a>
            </nav>
        </div>
    </header>

    <main>
<div class="blog-wrap">

    <div class="blog-header">
        <h1>Blog</h1>
        <p>Textos, reportagens e colunas sobre a cena cultural de Brasília</p>
    </div>


</div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-logo">✦</span>
            <p>Agenda DF &mdash; Francisco</p>
        </div>
    </footer>

    <script src="https://chiicones.github.io/theme/js/main.js"></script>
</body>
</html>
