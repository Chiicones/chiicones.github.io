<style>
  :root {
    --tt-bg:      #0a0c10;
    --tt-surface: #12151c;
    --tt-border:  #1e2330;
    --tt-accent:  #00f5a0;
    --tt-accent2: #00c3ff;
    --tt-text:    #e2e8f0;
    --tt-muted:   #64748b;
    --tiktok-r:   #ff0050;
    --tiktok-c:   #00f2ea;
  }

  .tiktok-page {
    background: var(--tt-bg);
    color: var(--tt-text);
    font-family: 'Syne', sans-serif;
    min-height: 80vh;
  }

  .tt-header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--tt-border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--tt-surface);
    position: relative; overflow: hidden;
  }
  .tt-header::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,245,160,.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .tt-logo { display: flex; align-items: center; gap: .75rem; }
  .tt-logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--tiktok-r), var(--tiktok-c));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    box-shadow: 0 0 18px rgba(0,242,234,.3);
  }
  .tt-logo-text { font-size: 1.1rem; font-weight: 800; letter-spacing: -.5px; color: var(--tt-text); }
  .tt-logo-text span { color: var(--tt-accent); }

  .tt-stats { display: flex; gap: 1.5rem; }
  .tt-stat { text-align: center; font-family: 'Space Mono', monospace; }
  .tt-stat-value { font-size: 1.1rem; font-weight: 700; color: var(--tt-accent); }
  .tt-stat-label { font-size: .65rem; color: var(--tt-muted); text-transform: uppercase; letter-spacing: 1px; }

  .tt-main {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: calc(100vh - 140px);
  }

  .tt-sidebar {
    background: var(--tt-surface);
    border-right: 1px solid var(--tt-border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .tt-sidebar-header {
    padding: 1rem 1.25rem .75rem;
    border-bottom: 1px solid var(--tt-border);
  }
  .tt-sidebar-title {
    font-size: .7rem; text-transform: uppercase;
    letter-spacing: 2px; color: var(--tt-muted); margin-bottom: .5rem;
  }
  .tt-search-box {
    display: flex; align-items: center; gap: .5rem;
    background: var(--tt-bg);
    border: 1px solid var(--tt-border);
    border-radius: 8px; padding: .5rem .75rem;
    transition: border-color .2s;
  }
  .tt-search-box:focus-within { border-color: var(--tt-accent); }
  .tt-search-box input {
    background: none; border: none; outline: none;
    color: var(--tt-text); font-family: 'Syne', sans-serif;
    font-size: .85rem; width: 100%;
  }

  .tt-chips {
    display: flex; flex-wrap: wrap; gap: .4rem;
    padding: .75rem 1.25rem;
    border-bottom: 1px solid var(--tt-border);
  }
  .tt-chip {
    padding: .25rem .7rem; border-radius: 999px;
    font-size: .72rem; font-weight: 700; cursor: pointer;
    border: 1px solid transparent; transition: all .2s;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .tt-chip.all     { background: var(--tt-accent); color: var(--tt-bg); }
  .tt-chip.food    { background: transparent; border-color: #f97316; color: #f97316; }
  .tt-chip.cultura { background: transparent; border-color: #a78bfa; color: #a78bfa; }
  .tt-chip.lazer   { background: transparent; border-color: var(--tt-accent2); color: var(--tt-accent2); }
  .tt-chip.turismo { background: transparent; border-color: #fbbf24; color: #fbbf24; }
  .tt-chip:hover   { opacity: .8; transform: scale(1.05); }

  .tt-video-list {
    overflow-y: auto; flex: 1; padding: .75rem;
    display: flex; flex-direction: column; gap: .5rem;
  }
  .tt-video-list::-webkit-scrollbar { width: 4px; }
  .tt-video-list::-webkit-scrollbar-thumb { background: var(--tt-border); border-radius: 4px; }

  .tt-card {
    background: var(--tt-bg);
    border: 1px solid var(--tt-border);
    border-radius: 10px; padding: .85rem;
    cursor: pointer; transition: all .2s;
    position: relative; overflow: hidden;
  }
  .tt-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--cat-color, var(--tt-accent));
    border-radius: 3px 0 0 3px;
  }
  .tt-card:hover { border-color: var(--tt-accent); transform: translateX(3px); }
  .tt-card.active { border-color: var(--tt-accent); background: rgba(0,245,160,.04); }

  .tt-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; margin-bottom: .5rem; }
  .tt-card-location { font-size: .8rem; font-weight: 700; color: var(--tt-text); }
  .tt-card-cat { font-size: .62rem; padding: .15rem .5rem; border-radius: 999px; font-weight: 700; text-transform: uppercase; flex-shrink: 0; }
  .tt-card-desc { font-size: .75rem; color: var(--tt-muted); line-height: 1.5; margin-bottom: .6rem; }
  .tt-card-meta { display: flex; gap: 1rem; font-family: 'Space Mono', monospace; font-size: .65rem; color: var(--tt-muted); }

  #tt-map { width: 100%; height: 100%; z-index: 1; }
  .leaflet-tile { filter: brightness(.85) saturate(.7) hue-rotate(200deg); }

  .leaflet-popup-content-wrapper {
    background: var(--tt-surface) !important;
    border: 1px solid var(--tt-border) !important;
    border-radius: 12px !important;
    color: var(--tt-text) !important;
    font-family: 'Syne', sans-serif !important;
  }
  .leaflet-popup-tip { background: var(--tt-surface) !important; }
  .tt-popup { min-width: 220px; }
  .tt-popup-cat { font-size: .6rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: .4rem; }
  .tt-popup-title { font-size: 1rem; font-weight: 800; margin-bottom: .3rem; }
  .tt-popup-desc { font-size: .78rem; color: var(--tt-muted); margin-bottom: .75rem; line-height: 1.5; }
  .tt-popup-stats { display: flex; gap: 1rem; font-family: 'Space Mono', monospace; font-size: .68rem; border-top: 1px solid var(--tt-border); padding-top: .6rem; }
  .tt-popup-stat-v { font-weight: 700; color: var(--tt-accent); }
  .tt-popup-stat-l { color: var(--tt-muted); }
  .tt-popup-link {
    display: inline-flex; align-items: center; gap: .4rem;
    margin-top: .75rem; padding: .4rem .9rem;
    background: linear-gradient(135deg, var(--tiktok-r), var(--tiktok-c));
    border-radius: 999px; font-size: .72rem; font-weight: 700;
    color: #fff; text-decoration: none; transition: opacity .2s;
  }
  .tt-popup-link:hover { opacity: .85; }

  .tt-marker { width: 36px; height: 36px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,.15); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .tt-marker-inner { transform: rotate(45deg); font-size: .95rem; }

  .tt-legend {
    position: absolute; top: 1rem; right: 1rem; z-index: 1000;
    background: var(--tt-surface); border: 1px solid var(--tt-border);
    border-radius: 10px; padding: .75rem 1rem; font-size: .75rem;
  }
  .tt-legend-title { font-size: .6rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--tt-muted); margin-bottom: .6rem; }
  .tt-legend-item { display: flex; align-items: center; gap: .5rem; margin-bottom: .3rem; }
  .tt-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  @media (max-width: 768px) {
    .tt-main { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; }
    #tt-map { height: 50vh; }
    .tt-stats { display: none; }
    .tt-sidebar { height: 50vh; }
  }
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
// ============ CONFIGURAÇÃO ============
// CADASTRE-SE EM: https://rapidapi.com/rockethearth/api/tiktok-api23/
// E COLOQUE SUA CHAVE AQUI:
const RAPIDAPI_KEY = 'a57b513e66mshe13ca19ef6da2b3p128594jsn5d57b95eef8d'; // <-- SUBSTITUA POR SUA CHAVE REAL

// ============ DADOS FALLBACK (CASO A API FALHE) ============
const fallbackVideos = [
  { id:1, location:"Esplanada dos Ministérios", lat:-15.7994, lng:-47.8645, category:"turismo", description:"Vista aérea impressionante da Esplanada ao nascer do sol 🌅", views:"284K", likes:"41K", hashtags:"#Brasília #Esplanada #DF", url:"#" },
  { id:2, location:"Pontão do Lago Sul", lat:-15.8370, lng:-47.8720, category:"lazer", description:"Final de semana perfeito no Pontão com food trucks e música ao vivo 🎶", views:"156K", likes:"22K", hashtags:"#LagoSul #Pontão #BSB", url:"#" },
  { id:3, location:"Feira da Torre", lat:-15.7893, lng:-47.8958, category:"food", description:"Os melhores churros de Brasília estão aqui, sem discussão 🍩", views:"98K", likes:"17K", hashtags:"#FeiradaTorre #Gastronomia #Brasília", url:"#" },
  { id:4, location:"Museu Nacional", lat:-15.7980, lng:-47.8754, category:"cultura", description:"Exposição nova no Museu Nacional — vale muito a visita! 🎨", views:"73K", likes:"9K", hashtags:"#MuseuNacional #CulturaBSB #DF", url:"#" },
  { id:5, location:"Parque da Cidade", lat:-15.8139, lng:-47.9108, category:"lazer", description:"Corrida e skate no maior parque urbano do mundo 🛹", views:"211K", likes:"33K", hashtags:"#ParquedaCidade #BSB #Lazer", url:"#" },
  { id:6, location:"Catedral de Brasília", lat:-15.7984, lng:-47.8754, category:"turismo", description:"A arquitetura da Catedral é simplesmente surreal ✨", views:"320K", likes:"58K", hashtags:"#Catedral #NiemeyerBSB #Turismo", url:"#" },
  { id:7, location:"Mercado Sul - Taguatinga", lat:-15.8401, lng:-48.0467, category:"food", description:"Rolê pelo Mercado Sul: pastel, caldo de cana e muita história 🥤", views:"67K", likes:"11K", hashtags:"#Taguatinga #MercadoSul #ComidaDeRua", url:"#" },
  { id:8, location:"Teatro Nacional", lat:-15.7972, lng:-47.8837, category:"cultura", description:"Peça incrível no Teatro Nacional — agenda cultural de BSB tá on 🎭", views:"45K", likes:"7K", hashtags:"#TeatroNacional #CulturaBSB #Brasília", url:"#" }
];

// ============ FUNÇÕES DE PROCESSAMENTO ============
function extractLatitude(location) {
  const locations = {
    'esplanada': -15.7994, 'pontão': -15.8370, 'torre': -15.7893,
    'museu': -15.7980, 'parque': -15.8139, 'catedral': -15.7984,
    'tagua': -15.8401, 'teatro': -15.7972, 'asa sul': -15.8220,
    'asa norte': -15.7580
  };
  
  const locationLower = location.toLowerCase();
  for (const [key, lat] of Object.entries(locations)) {
    if (locationLower.includes(key)) return lat;
  }
  return -15.7998;
}

function extractLongitude(location) {
  const locations = {
    'esplanada': -47.8645, 'pontão': -47.8720, 'torre': -47.8958,
    'museu': -47.8754, 'parque': -47.9108, 'catedral': -47.8754,
    'tagua': -48.0467, 'teatro': -47.8837, 'asa sul': -47.9260,
    'asa norte': -47.9020
  };
  
  const locationLower = location.toLowerCase();
  for (const [key, lng] of Object.entries(locations)) {
    if (locationLower.includes(key)) return lng;
  }
  return -47.8645;
}

function categorizeVideo(description, hashtags) {
  const text = (description + ' ' + (hashtags || '')).toLowerCase();
  
  if (text.includes('comida') || text.includes('restaurante') || text.includes('food')) return 'food';
  if (text.includes('cultura') || text.includes('museu') || text.includes('arte')) return 'cultura';
  if (text.includes('parque') || text.includes('lazer') || text.includes('skate')) return 'lazer';
  if (text.includes('turismo') || text.includes('passeio')) return 'turismo';
  
  return 'turismo';
}

function formatNumber(num) {
  if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return num.toString();
}

// ============ API DE TERCEIROS (RAPIDAPI) ============
async function fetchTikTokVideosBrasilia() {
  // Verifica se tem chave configurada
  if (!RAPIDAPI_KEY || RAPIDAPI_KEY === 'SUA_CHAVE_AQUI') {
    console.warn('⚠️ API Key não configurada. Usando dados de fallback.');
    return fallbackVideos;
  }

  try {
    console.log('🎬 Buscando vídeos reais do TikTok...');
    
    // Opção 1: TikTok Video Search API
    const response = await fetch('https://tiktok-api23.p.rapidapi.com/api/search', {
      method: 'POST',
      headers: {
        'x-rapidapi-host': 'tiktok-api23.p.rapidapi.com',
        'x-rapidapi-key': RAPIDAPI_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        keywords: 'Brasília DF Brasil',
        count: 30,
        cursor: 0,
        sort_type: 0  // 0 = relevância, 1 = mais recentes
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();
    
    if (!data.data || data.data.length === 0) {
      console.warn('Nenhum vídeo encontrado na API');
      return fallbackVideos;
    }

    console.log(`✅ Encontrados ${data.data.length} vídeos`);
    
    // Processa os dados da API
    const videos = data.data.map((item, index) => {
      // Extrair localização da descrição
      let location = 'Brasília, DF';
      const desc = item.desc || '';
      
      if (desc.includes('Esplanada')) location = 'Esplanada dos Ministérios';
      else if (desc.includes('Pontão')) location = 'Pontão do Lago Sul';
      else if (desc.includes('Torre')) location = 'Torre de TV';
      else if (desc.includes('Parque')) location = 'Parque da Cidade';
      else if (desc.includes('Catedral')) location = 'Catedral de Brasília';
      else if (desc.includes('Mercado')) location = 'Mercado Sul - Taguatinga';
      else if (desc.includes('Teatro')) location = 'Teatro Nacional';
      
      return {
        id: item.id || index,
        location: location,
        lat: extractLatitude(location),
        lng: extractLongitude(location),
        category: categorizeVideo(item.desc, item.hashtags?.join(' ')),
        description: item.desc || '🎬 Vídeo de Brasília no TikTok',
        views: formatNumber(item.play_count || 0),
        likes: formatNumber(item.digg_count || 0),
        hashtags: item.hashtags ? '#' + item.hashtags.join(' #') : '#Brasília',
        url: `https://www.tiktok.com/@${item.author?.unique_id || 'user'}/video/${item.id}`,
        author: item.author?.unique_id,
        music: item.music?.title,
        thumbnail: item.video?.cover || ''
      };
    });

    return videos.filter(v => v.id); // Remove vídeos inválidos
    
  } catch (error) {
    console.error('❌ Erro ao buscar vídeos da API:', error);
    console.log('📦 Usando dados de fallback...');
    return fallbackVideos;
  }
}

// ============ CONFIGURAÇÃO DO MAPA E INTERFACE ============
var catConfig = {
  food:    { color:'#f97316', emoji:'🍽️' },
  cultura: { color:'#a78bfa', emoji:'🎭' },
  lazer:   { color:'#00c3ff', emoji:'🏄' },
  turismo: { color:'#fbbf24', emoji:'📍' }
};

var ttMap = L.map('tt-map', { center:[-15.7998,-47.8645], zoom:12 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors', maxZoom:19
}).addTo(ttMap);

var clusterGroup = L.markerClusterGroup({ maxClusterRadius:50 });
var ttMarkers = {};
var activeFilter = 'all';
var searchTerm = '';
var activeCard = null;
var videos = []; // Será preenchido pela API

function createIcon(cat) {
  var cfg = catConfig[cat];
  return L.divIcon({
    html:'<div class="tt-marker" style="background:' + cfg.color + '20;border-color:' + cfg.color + '"><div class="tt-marker-inner">' + cfg.emoji + '</div></div>',
    className:'', iconSize:[36,36], iconAnchor:[18,36], popupAnchor:[0,-36]
  });
}

function buildPopup(v) {
  var cfg = catConfig[v.category];
  return '<div class="tt-popup">' +
    '<div class="tt-popup-cat" style="color:' + cfg.color + '">' + cfg.emoji + ' ' + v.category + '</div>' +
    '<div class="tt-popup-title">' + v.location + '</div>' +
    '<div class="tt-popup-desc">' + v.description + '</div>' +
    '<div style="font-size:.65rem;color:#64748b;margin-bottom:.5rem">' + v.hashtags + '</div>' +
    '<div class="tt-popup-stats"><div><div class="tt-popup-stat-v">' + v.views + '</div><div class="tt-popup-stat-l">views</div></div><div><div class="tt-popup-stat-v">' + v.likes + '</div><div class="tt-popup-stat-l">likes</div></div></div>' +
    '<a href="' + v.url + '" target="_blank" class="tt-popup-link">▶ Ver no TikTok</a></div>';
}

function filtered() {
  return videos.filter(function(v) {
    var matchCat = activeFilter === 'all' || v.category === activeFilter;
    var matchSearch = !searchTerm || v.location.toLowerCase().indexOf(searchTerm) !== -1 || v.description.toLowerCase().indexOf(searchTerm) !== -1;
    return matchCat && matchSearch;
  });
}

function render() {
  clusterGroup.clearLayers();
  ttMarkers = {};
  var list = document.getElementById('tt-list');
  list.innerHTML = '';

  var fv = filtered();
  document.getElementById('tt-total').textContent = fv.length;
  document.getElementById('tt-locs').textContent = fv.length;
  
  // Calcular total de views
  var totalViews = 0;
  fv.forEach(function(v) {
    var viewsNum = parseFloat(v.views) * (v.views.includes('M') ? 1000000 : v.views.includes('K') ? 1000 : 1);
    totalViews += viewsNum;
  });
  document.getElementById('tt-views').textContent = formatNumber(totalViews);

  fv.forEach(function(v) {
    var m = L.marker([v.lat, v.lng], { icon: createIcon(v.category) })
      .bindPopup(buildPopup(v), { maxWidth:280 });
    m.on('click', function() { activateCard(v.id); });
    ttMarkers[v.id] = m;
    clusterGroup.addLayer(m);

    var cfg = catConfig[v.category];
    var card = document.createElement('div');
    card.className = 'tt-card' + (activeCard === v.id ? ' active' : '');
    card.style.setProperty('--cat-color', cfg.color);
    card.dataset.id = v.id;
    card.innerHTML = '<div class="tt-card-top">' +
      '<div class="tt-card-location">' + cfg.emoji + ' ' + v.location + '</div>' +
      '<div class="tt-card-cat" style="background:' + cfg.color + '20;color:' + cfg.color + '">' + v.category + '</div></div>' +
      '<div class="tt-card-desc">' + v.description + '</div>' +
      '<div class="tt-card-meta"><span>👁 ' + v.views + '</span><span>❤️ ' + v.likes + '</span></div>';
    card.addEventListener('click', function() {
      activateCard(v.id);
      ttMap.setView([v.lat, v.lng], 15, { animate:true });
      ttMarkers[v.id].openPopup();
    });
    list.appendChild(card);
  });
}

function activateCard(id) {
  activeCard = id;
  document.querySelectorAll('.tt-card').forEach(function(c) {
    c.classList.toggle('active', Number(c.dataset.id) === id);
  });
}

ttMap.addLayer(clusterGroup);

// ============ EVENT LISTENERS ============
document.querySelectorAll('.tt-chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    document.querySelectorAll('.tt-chip').forEach(function(c) { c.classList.remove('active'); });
    chip.classList.add('active');
    activeFilter = chip.dataset.cat;
    render();
  });
});

document.getElementById('tt-search').addEventListener('input', function(e) {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

// ============ INICIALIZAÇÃO ============
async function init() {
  // Mostrar loading
  const loadingDiv = document.createElement('div');
  loadingDiv.id = 'tt-loading';
  loadingDiv.style.cssText = `
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9); color: white; padding: 20px 40px;
    border-radius: 12px; z-index: 9999; text-align: center;
    font-family: monospace; border: 1px solid #00f5a0;
  `;
  loadingDiv.innerHTML = '🎬 Carregando vídeos do TikTok...<br><small style="color:#888">Isso pode levar alguns segundos</small>';
  document.body.appendChild(loadingDiv);
  
  // Buscar vídeos
  videos = await fetchTikTokVideosBrasilia();
  
  // Remover loading
  loadingDiv.remove();
  
  // Renderizar
  render();
  
  // Mensagem de sucesso/fallback
  if (videos === fallbackVideos) {
    console.log('ℹ️ Usando dados de demonstração. Configure sua API Key no RapidAPI para dados reais.');
  } else {
    console.log('✅ Dados carregados com sucesso!');
  }
}

// Iniciar
init();
</script>
