<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca — Agenda DF</title>
    <meta name="description" content="Eventos e experiências em Brasília">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://chiicones.github.io/theme/css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="https://chiicones.github.io/" class="site-logo">
                <span class="site-logo__name">Agenda DF</span>
            </a>
            <form class="header-search" action="https://chiicones.github.io/busca.html" method="get">
                <input type="text" name="q" class="header-search__input" placeholder="Buscar eventos...">
                <button type="submit" class="header-search__btn">→</button>
            </form>
        </div>
    </header>

    <main class="site-main">

<div class="taxonomy-header">
    <p class="taxonomy-label">Busca</p>
    <h1 class="taxonomy-title">O que você procura?</h1>
</div>

<section class="search-section">
    <div class="container">
        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="Teatro, Circo, CCBB, Águas Claras...">
        </div>
        <div id="search-results" class="search-results"></div>
    </div>
</section>

<script>
let articles = [];

fetch('https://chiicones.github.io/search.json')
    .then(r => r.json())
    .then(data => {
        articles = data;
        const q = new URLSearchParams(window.location.search).get('q');
        if (q) {
            document.getElementById('search-input').value = q;
            doSearch(q);
        }
    });

document.getElementById('search-input').addEventListener('input', function() {
    doSearch(this.value);
});

function doSearch(query) {
    const q = query.toLowerCase().trim();
    const results = document.getElementById('search-results');

    if (!q) { results.innerHTML = ''; return; }

    const matched = articles.filter(a =>
        (a.title && a.title.toLowerCase().includes(q)) ||
        (a.summary && a.summary.toLowerCase().includes(q)) ||
        (a.tags && a.tags.toLowerCase().includes(q)) ||
        (a.category && a.category.toLowerCase().includes(q)) ||
        (a.local && a.local.toLowerCase().includes(q))
    );

    if (!matched.length) {
        results.innerHTML = '<p class="search-empty">Nenhum resultado encontrado.</p>';
        return;
    }

    results.innerHTML = matched.map(a => `
        <article class="event-card">
            <div class="event-card__badge">
                <a href="https://chiicones.github.io/${a.category_url}" class="tag tag--category">${a.category}</a>
            </div>
            <div class="event-card__body">
                <h2 class="event-card__title">
                    <a href="https://chiicones.github.io/${a.url}">${a.title}</a>
                </h2>
                <div class="event-info-grid">
                    ${a.local ? `<div class="event-info-row"><span class="event-info-label">Local</span><span class="event-info-value">${a.local}</span></div>` : ''}
                    ${a.data ? `<div class="event-info-row"><span class="event-info-label">Data</span><span class="event-info-value">${a.data}</span></div>` : ''}
                    ${a.entrada ? `<div class="event-info-row"><span class="event-info-label">Entrada</span><span class="event-info-value event-info-value--highlight">${a.entrada}</span></div>` : ''}
                </div>
                <a href="https://chiicones.github.io/${a.url}" class="event-card__cta">Ver detalhes <span class="arrow">→</span></a>
            </div>
        </article>
    `).join('');
}
</script>

    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-col footer-col--categories">
                <p class="footer-col__title">Categorias</p>
                    <a href="/categoria/circo.html" class="footer-link">Circo</a>
                    <a href="/categoria/comedia.html" class="footer-link">Comédia</a>
                    <a href="/categoria/exposicao.html" class="footer-link">Exposição</a>
                    <a href="/categoria/familia.html" class="footer-link">Família</a>
                    <a href="/categoria/feira.html" class="footer-link">Feira</a>
                    <a href="/categoria/festival.html" class="footer-link">Festival</a>
                    <a href="/categoria/musica.html" class="footer-link">Música</a>
                    <a href="/categoria/teatro.html" class="footer-link">Teatro</a>
            </div>
            <div class="footer-col footer-col--extra">
                <p class="footer-col__title">Mais</p>
                    <a href="/busca.html" class="footer-link">Busca</a>
                    <a href="/categoria/blog.html" class="footer-link">Blog</a>
                    <a href="/pages/sobre.html" class="footer-link">Sobre</a>
                <p class="footer-copy">&copy; 2026 Agenda DF</p>
            </div>
        </div>
    </footer>

    <script src="https://chiicones.github.io/theme/js/main.js"></script>
</body>
</html>
