<style>

}

    font-size: 0.85rem;

}
.tiktok-embed-wrap {

    align-items: center;

}

<body>

    <header class="site-header">

            <nav class="main-nav">
                    <a href="/">Eventos</a>
                    <a href="/agenda.html">Agenda</a>

        </div>

    <main>
<div class="tiktok-wrap">
    <h1>TikTok BSB</h1>
    <p class="tiktok-subtitle">Eventos em Brasília no TikTok</p>
    <div class="tiktok-embed-wrap">

        <p style="color: var(--ink-light); font-style: italic; font-size: 0.9rem;">
            Embeds do TikTok aparecerão aqui.
        </p>

</div>
    </main>

    <footer class="site-footer">
