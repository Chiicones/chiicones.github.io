<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progresso — Dia · Semana · Mês · Ano</title>
<style>
  :root{
    --bg: #0a0d16;
    --bg-card: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.08);
    --text: #eef0f6;
    --text-dim: #7b8399;
    --grad-1: #6366f1;
    --grad-2: #a855f7;
    --grad-3: #ec4899;
    --grad-4: #2dd4bf;
    --track: rgba(255,255,255,0.06);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  canvas#bg{
    position: fixed;
    top:0; left:0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap: 14px;
  }

  .brand-icon{
    width:40px; height:40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    background: rgba(99,102,241,0.08);
    color: #a5b4fc;
    font-size: 18px;
  }

  .brand h1{
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand span{
    display:block;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  .clock{
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .clock b{ color: var(--text); font-weight: 600; }

  /* ---- Nav tabs (Bar / Cycle / Tally / Grid) ---- */
  .view-tabs{
    display:flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
  }
  .view-tab{
    display:flex; align-items:center; gap:6px;
    padding: 8px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .view-tab:hover:not(.active){ color: var(--text); background: rgba(255,255,255,0.04); }
  .view-tab.active{
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    color: #fff;
  }

  /* ---- Period pills (Dia / Semana / Mês / Ano) ---- */
  .period-tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .period-tab{
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .period-tab:hover:not(.active){ color: var(--text); border-color: rgba(255,255,255,0.2); }
  .period-tab.active{
    color: #fff;
    border-color: #8b5cf6;
    background: rgba(139,92,246,0.14);
  }

  /* ---- Bar view (cards grid) ---- */
  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  @media (max-width: 720px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    backdrop-filter: blur(6px);
    transition: border-color 0.3s ease;
  }
  .card:hover{ border-color: rgba(255,255,255,0.16); }

  .card-top{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .card-label{ font-size: 13px; color: var(--text-dim); font-weight: 500; }
  .card-percent{ font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

  .bar-track{
    width: 100%; height: 14px; border-radius: 999px;
    background: var(--track); overflow: hidden; margin-bottom: 20px;
  }
  .bar-fill{
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3), var(--grad-4));
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }

  .stats{ display:flex; gap: 24px; flex-wrap: wrap; }
  .stat-label{ font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .stat-value{ font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---- Single panel (Cycle / Tally / Grid) ---- */
  .panel{
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
    backdrop-filter: blur(6px);
  }
  .panel-header{
    display:flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
  }
  .panel-title{ font-size: 19px; font-weight: 600; }
  .panel-subtitle{ font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .panel-percent{ font-size: 40px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

  .legend{ display:flex; gap: 18px; font-size: 12px; color: var(--text-dim); align-items:center; }
  .legend-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }

  /* Grid view */
  .dot-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(15px, 1fr));
    gap: 7px;
    margin-bottom: 28px;
  }
  .dot{ width:14px; height:14px; border-radius:50%; background: var(--track); }
  .dot.past{ background: #2dd4bf; }
  .dot.current{
    background: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.18);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(255,255,255,0.35); }
    50%{ box-shadow: 0 0 0 7px rgba(255,255,255,0); }
  }

  /* Cycle view */
  .cycle-wrap{ display:flex; align-items:center; gap: 40px; flex-wrap: wrap; justify-content:center; padding: 12px 0 28px; }
  .cycle-ring{ position:relative; width: 220px; height: 220px; flex-shrink:0; }
  .cycle-ring svg{ transform: rotate(-90deg); }
  .cycle-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }
  .cycle-center .pct{ font-size: 32px; font-weight: 700; letter-spacing:-0.02em; }
  .cycle-center .lbl{ font-size: 11px; color: var(--text-dim); margin-top: 4px; text-transform:uppercase; letter-spacing:0.06em;}

  /* Tally view */
  .tally-groups{ display:flex; flex-wrap:wrap; gap: 14px; margin-bottom: 28px; align-items:flex-end; }
  .tally-group{ position:relative; width: 26px; height: 30px; }
  .tally-bar{ position:absolute; bottom:0; width:3px; height:100%; border-radius:2px; background: var(--track); }
  .tally-bar.past{ background:#2dd4bf; }
  .tally-bar.current{ background:#fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.18); animation: pulse 1.6s infinite; }
  .tally-diag{ position:absolute; width: 36px; height:3px; background:#2dd4bf; top:50%; left:-5px; transform: rotate(-32deg); border-radius:2px; }

  .stats-row{ display:flex; gap: 32px; flex-wrap:wrap; padding-top: 20px; border-top: 1px solid var(--border); }

  footer{ text-align:center; margin-top: 40px; font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-icon">◔</div>
      <div>
        <h1>Progresso</h1>
        <span>DIA · SEMANA · MÊS · ANO</span>
      </div>
    </div>
    <div class="view-tabs" id="viewTabs">
      <button class="view-tab" data-view="bar">▤ Barra</button>
      <button class="view-tab" data-view="cycle">◔ Ciclo</button>
      <button class="view-tab" data-view="tally"># Contagem</button>
      <button class="view-tab" data-view="grid">▦ Grade</button>
    </div>
  </header>

  <div class="clock" id="clock" style="margin-bottom:20px;"></div>

  <div class="period-tabs" id="periodTabs" style="display:none;">
    <button class="period-tab" data-period="day">Dia</button>
    <button class="period-tab" data-period="week">Semana</button>
    <button class="period-tab" data-period="month">Mês</button>
    <button class="period-tab" data-period="year">Ano</button>
  </div>

  <div class="grid" id="barView"></div>
  <div class="panel" id="singleView" style="display:none;"></div>

  <footer>Atualiza automaticamente a cada segundo — sem servidor, tudo no seu navegador.</footer>
</div>

<script>
// ================= Estado =================
let currentView = 'bar';       // bar | cycle | tally | grid
let currentPeriod = 'year';    // day | week | month | year

const periodDefs = [
  { key:'day',   label:'Hoje' },
  { key:'week',  label:'Esta Semana' },
  { key:'month', label:'Este Mês' },
  { key:'year',  label:'Este Ano' },
];

const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho",
               "Agosto","Setembro","Outubro","Novembro","Dezembro"];
const diasSemana = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function daysInMonth(year, month){ return new Date(year, month + 1, 0).getDate(); }

// ================= Cálculo de cada período =================
function computePeriod(key, now){
  const startDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  if(key === 'day'){
    const endDay = new Date(startDay); endDay.setDate(endDay.getDate() + 1);
    const percent = (now - startDay) / (endDay - startDay) * 100;
    const hoursLeft = Math.floor((endDay - now) / 3600000);
    const minutesLeft = Math.floor(((endDay - now) % 3600000) / 60000);
    return {
      title: `HOJE — ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`,
      subtitle: 'Um ponto = uma hora',
      percent,
      passedLabel:'Horas passadas', passedValue:`${now.getHours()} / 23`,
      leftLabel:'Restam', leftValue:`${hoursLeft}h ${minutesLeft}min`,
      unitLabel:'hora', unitsTotal: 24, unitsPassed: now.getHours(),
    };
  }

  if(key === 'week'){
    const weekday = (now.getDay() + 6) % 7; // 0 = segunda
    const startWeek = new Date(startDay); startWeek.setDate(startWeek.getDate() - weekday);
    const endWeek = new Date(startWeek); endWeek.setDate(endWeek.getDate() + 7);
    const percent = (now - startWeek) / (endWeek - startWeek) * 100;
    return {
      title: 'ESTA SEMANA',
      subtitle: 'Um ponto = um dia',
      percent,
      passedLabel:'Dias passados', passedValue:`${weekday + 1} / 7`,
      leftLabel:'Dias restantes', leftValue:`${6 - weekday}`,
      unitLabel:'dia', unitsTotal: 7, unitsPassed: weekday,
    };
  }

  if(key === 'month'){
    const dim = daysInMonth(now.getFullYear(), now.getMonth());
    const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const endMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const percent = (now - startMonth) / (endMonth - startMonth) * 100;
    return {
      title: `${meses[now.getMonth()].toUpperCase()} ${now.getFullYear()}`,
      subtitle: 'Um ponto = um dia',
      percent,
      passedLabel:'Dias passados', passedValue:`${now.getDate()} / ${dim}`,
      leftLabel:'Dias restantes', leftValue:`${dim - now.getDate()}`,
      unitLabel:'dia', unitsTotal: dim, unitsPassed: now.getDate() - 1,
    };
  }

  // year
  const startYear = new Date(now.getFullYear(), 0, 1);
  const endYear = new Date(now.getFullYear() + 1, 0, 1);
  const percent = (now - startYear) / (endYear - startYear) * 100;
  const dayOfYear = Math.floor((startDay - startYear) / 86400000) + 1;
  const daysInYear = Math.round((endYear - startYear) / 86400000);
  return {
    title: `ANO ${now.getFullYear()}`,
    subtitle: 'Um ponto = um dia',
    percent,
    passedLabel:'Dias passados', passedValue:`${dayOfYear} / ${daysInYear}`,
    leftLabel:'Dias restantes', leftValue:`${daysInYear - dayOfYear}`,
    unitLabel:'dia', unitsTotal: daysInYear, unitsPassed: dayOfYear - 1,
  };
}

// ================= Bar view =================
const barViewEl = document.getElementById('barView');
periodDefs.forEach(def => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-top">
      <div class="card-label" id="title-${def.key}">${def.label}</div>
      <div class="card-percent" id="percent-${def.key}">0%</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-${def.key}" style="width:0%"></div></div>
    <div class="stats">
      <div><div class="stat-label" id="passedLabel-${def.key}">Passado</div><div class="stat-value" id="passedValue-${def.key}">–</div></div>
      <div><div class="stat-label" id="leftLabel-${def.key}">Restante</div><div class="stat-value" id="leftValue-${def.key}">–</div></div>
    </div>`;
  barViewEl.appendChild(card);
});

function updateBarView(now){
  periodDefs.forEach(def => {
    const d = computePeriod(def.key, now);
    document.getElementById(`percent-${def.key}`).textContent = `${d.percent.toFixed(4)}%`;
    document.getElementById(`bar-${def.key}`).style.width = `${Math.min(d.percent,100)}%`;
    document.getElementById(`passedLabel-${def.key}`).textContent = d.passedLabel;
    document.getElementById(`passedValue-${def.key}`).textContent = d.passedValue;
    document.getElementById(`leftLabel-${def.key}`).textContent = d.leftLabel;
    document.getElementById(`leftValue-${def.key}`).textContent = d.leftValue;
  });
}

// ================= Single view (Cycle / Tally / Grid) =================
const singleViewEl = document.getElementById('singleView');
let lastBuiltKey = null; // evita reconstruir DOM sem necessidade

function statsRowHtml(d){
  return `
    <div class="stats-row">
      <div><div class="stat-label">${d.passedLabel}</div><div class="stat-value">${d.passedValue}</div></div>
      <div><div class="stat-label">${d.leftLabel}</div><div class="stat-value">${d.leftValue}</div></div>
    </div>`;
}

function buildGridPanel(d){
  let dots = '';
  for(let i=0; i<d.unitsTotal; i++){
    const cls = i < d.unitsPassed ? 'past' : (i === d.unitsPassed ? 'current' : '');
    dots += `<div class="dot ${cls}"></div>`;
  }
  singleViewEl.innerHTML = `
    <div class="panel-header">
      <div>
        <div class="panel-title">${d.title}</div>
        <div class="panel-subtitle">${d.subtitle}</div>
      </div>
      <div class="legend">
        <span><span class="legend-dot" style="background:var(--track)"></span>Futuro</span>
        <span><span class="legend-dot" style="background:#2dd4bf"></span>Passado</span>
        <span><span class="legend-dot" style="background:#fff"></span>Atual</span>
      </div>
    </div>
    <div class="dot-grid">${dots}</div>
    ${statsRowHtml(d)}`;
}

function buildCyclePanel(d){
  const r = 90, c = 2 * Math.PI * r;
  const offset = c - (Math.min(d.percent,100) / 100) * c;
  singleViewEl.innerHTML = `
    <div class="panel-header">
      <div>
        <div class="panel-title">${d.title}</div>
        <div class="panel-subtitle">${d.subtitle}</div>
      </div>
    </div>
    <div class="cycle-wrap">
      <div class="cycle-ring">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="35%" stop-color="#a855f7"/>
              <stop offset="65%" stop-color="#ec4899"/>
              <stop offset="100%" stop-color="#2dd4bf"/>
            </linearGradient>
          </defs>
          <circle cx="110" cy="110" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14"/>
          <circle id="cycleProgress" cx="110" cy="110" r="${r}" fill="none" stroke="url(#ringGrad)"
            stroke-width="14" stroke-linecap="round"
            stroke-dasharray="${c}" stroke-dashoffset="${offset}"
            style="transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1)"/>
        </svg>
        <div class="cycle-center">
          <div class="pct">${d.percent.toFixed(2)}%</div>
          <div class="lbl">concluído</div>
        </div>
      </div>
      <div style="flex:1; min-width:200px;">${statsRowHtml(d)}</div>
    </div>`;
}

function buildTallyPanel(d){
  const total = d.unitsTotal;
  const passed = d.unitsPassed;
  const totalGroups = Math.ceil(total / 5);
  let groups = '';
  for(let g=0; g<totalGroups; g++){
    const startIdx = g * 5;
    const count = Math.min(5, total - startIdx);
    let bars = '';
    let passedCount = 0;
    for(let i=0; i<count; i++){
      const idx = startIdx + i;
      let cls = 'future';
      if(idx < passed){ cls = 'past'; passedCount++; }
      else if(idx === passed){ cls = 'current'; }
      bars += `<div class="tally-bar ${cls}" style="left:${i*7}px"></div>`;
    }
    const diag = (passedCount === 5) ? '<div class="tally-diag"></div>' : '';
    groups += `<div class="tally-group">${bars}${diag}</div>`;
  }

  singleViewEl.innerHTML = `
    <div class="panel-header">
      <div>
        <div class="panel-title">${d.title}</div>
        <div class="panel-subtitle">Cada grupo de 5 traços = 5 ${d.unitLabel}s</div>
      </div>
      <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
        <div class="legend">
          <span><span class="legend-dot" style="background:var(--track)"></span>Futuro</span>
          <span><span class="legend-dot" style="background:#2dd4bf"></span>Passado</span>
          <span><span class="legend-dot" style="background:#fff"></span>Atual</span>
        </div>
        <div class="panel-percent">${d.percent.toFixed(2)}%</div>
      </div>
    </div>
    <div class="tally-groups">${groups}</div>
    ${statsRowHtml(d)}`;
}

function updateSingleView(now){
  const d = computePeriod(currentPeriod, now);
  const buildKey = `${currentView}-${currentPeriod}-${d.unitsTotal}`;

  if(currentView === 'grid'){
    if(lastBuiltKey !== buildKey){ buildGridPanel(d); lastBuiltKey = buildKey; }
    else {
      // apenas atualiza o dot atual e os números, sem reconstruir tudo
      const dots = singleViewEl.querySelectorAll('.dot');
      dots.forEach((el, i) => {
        el.className = 'dot' + (i < d.unitsPassed ? ' past' : (i === d.unitsPassed ? ' current' : ''));
      });
      const statVals = singleViewEl.querySelectorAll('.stat-value');
      if(statVals[0]) statVals[0].textContent = d.passedValue;
      if(statVals[1]) statVals[1].textContent = d.leftValue;
    }
  } else if(currentView === 'cycle'){
    buildCyclePanel(d);
  } else if(currentView === 'tally'){
    buildTallyPanel(d);
  }
}

// ================= Troca de abas =================
function setView(view){
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('barView').style.display = view === 'bar' ? 'grid' : 'none';
  document.getElementById('singleView').style.display = view === 'bar' ? 'none' : 'block';
  document.getElementById('periodTabs').style.display = view === 'bar' ? 'none' : 'flex';
  lastBuiltKey = null;
  render();
}

function setPeriod(period){
  currentPeriod = period;
  document.querySelectorAll('.period-tab').forEach(b => b.classList.toggle('active', b.dataset.period === period));
  lastBuiltKey = null;
  render();
}

document.getElementById('viewTabs').addEventListener('click', e => {
  const btn = e.target.closest('.view-tab');
  if(btn) setView(btn.dataset.view);
});
document.getElementById('periodTabs').addEventListener('click', e => {
  const btn = e.target.closest('.period-tab');
  if(btn) setPeriod(btn.dataset.period);
});

// ================= Loop principal =================
const clockEl = document.getElementById('clock');

function render(){
  const now = new Date();
  clockEl.innerHTML = `${diasSemana[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')} de ${meses[now.getMonth()]} — <b>${now.toLocaleTimeString('pt-BR')}</b>`;
  updateBarView(now);
  if(currentView !== 'bar') updateSingleView(now);
}

// estado inicial das abas (agora depois de render/clockEl já existirem)
setView('bar');
document.querySelector('.period-tab[data-period="year"]').classList.add('active');

render();
setInterval(render, 1000);

// ================= Fundo animado (opcional, isolado) =================
try {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('Canvas 2D context não disponível');

  let w, h, particles;

  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function initParticles(){
    const count = Math.max(0, Math.floor((w * h) / 22000));
    particles = Array.from({length: count}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15,
    }));
  }
  initParticles();
  window.addEventListener('resize', initParticles);

  function drawBg(){
    ctx.clearRect(0, 0, w, h);
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > w) p.vx *= -1;
      if(p.y < 0 || p.y > h) p.vy *= -1;
    }
    for(let i=0; i<particles.length; i++){
      const p = particles[i];
      for(let j=i+1; j<particles.length; j++){
        const a = particles[i], b = particles[j];
        const d = Math.hypot(a.x-b.x, a.y-b.y);
        if(d < 140){
          ctx.strokeStyle = `rgba(120,130,180,${0.12 * (1 - d/140)})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(160,170,220,0.5)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.3, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(drawBg);
  }
  drawBg();
} catch (err) {
  console.warn('Fundo animado desativado:', err);
}
</script>
