<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TikTok BSB · Mapa de Vídeos</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg:        #0a0c10;
      --surface:   #12151c;
      --border:    #1e2330;
      --accent:    #00f5a0;
      --accent2:   #00c3ff;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --tiktok-r:  #ff0050;
      --tiktok-c:  #00f2ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,245,160,.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--tiktok-r), var(--tiktok-c));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 0 18px rgba(0,242,234,.3);
    }
    .logo-text { font-size: 1.1rem; font-weight: 800; letter-spacing: -.5px; }
    .logo-text span { color: var(--accent); }

    .stats-bar {
      display: flex; gap: 1.5rem;
    }
    .stat {
      text-align: center;
      font-family: 'Space Mono', monospace;
    }
    .stat-value {
      font-size: 1.1rem; font-weight: 700;
      color: var(--accent);
    }
    .stat-label {
      font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
    }

    /* ── MAIN LAYOUT ── */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 70px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem 1.25rem .75rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size: .7rem; text-transform: uppercase;
      letter-spacing: 2px; color: var(--muted); margin-bottom: .5rem;
    }
    .search-box {
      display: flex; align-items: center; gap: .5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .5rem .75rem;
      transition: border-color .2s;
    }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-family: 'Syne', sans-serif;
      font-size: .85rem; width: 100%;
    }
    .search-box span { color: var(--muted); font-size: .9rem; }

    .filter-chips {
      display: flex; flex-wrap: wrap; gap: .4rem;
      padding: .75rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .chip {
      padding: .25rem .7rem;
      border-radius: 999px;
      font-size: .72rem; font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .2s;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .chip.all     { background: var(--accent);  color: var(--bg); }
    .chip.food    { background: transparent; border-color: #f97316; color: #f97316; }
    .chip.cultura { background: transparent; border-color: #a78bfa; color: #a78bfa; }
    .chip.lazer   { background: transparent; border-color: var(--accent2); color: var(--accent2); }
    .chip.turismo { background: transparent; border-color: #fbbf24; color: #fbbf24; }
    .chip:hover   { opacity: .8; transform: scale(1.05); }
    .chip.active  { background: currentColor; }
    .chip.active span { color: var(--bg); }

    .video-list {
      overflow-y: auto;
      flex: 1;
      padding: .75rem;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .video-list::-webkit-scrollbar { width: 4px; }
    .video-list::-webkit-scrollbar-track { background: transparent; }
    .video-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .video-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .85rem;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }
    .video-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--cat-color, var(--accent));
      border-radius: 3px 0 0 3px;
    }
    .video-card:hover {
      border-color: var(--accent);
      transform: translateX(3px);
      box-shadow: -4px 0 20px rgba(0,245,160,.1);
    }
    .video-card.active {
      border-color: var(--accent);
      background: rgba(0,245,160,.04);
    }

    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: .5rem;
      margin-bottom: .5rem;
    }
    .card-location {
      font-size: .8rem; font-weight: 700;
      color: var(--text);
    }
    .card-cat {
      font-size: .62rem; padding: .15rem .5rem;
      border-radius: 999px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      flex-shrink: 0;
    }
    .card-desc {
      font-size: .75rem; color: var(--muted);
      line-height: 1.5; margin-bottom: .6rem;
    }
    .card-meta {
      display: flex; gap: 1rem;
      font-family: 'Space Mono', monospace;
      font-size: .65rem; color: var(--muted);
    }
    .card-meta span { display: flex; align-items: center; gap: .25rem; }

    /* ── MAP ── */
    #map {
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* Custom map tiles dark overlay */
    .leaflet-tile { filter: brightness(.85) saturate(.7) hue-rotate(200deg); }

    /* Custom popup */
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,.6) !important;
      color: var(--text) !important;
      font-family: 'Syne', sans-serif !important;
    }
    .leaflet-popup-tip { background: var(--surface) !important; }
    .popup-inner { min-width: 220px; }
    .popup-cat {
      font-size: .6rem; text-transform: uppercase; letter-spacing: 1.5px;
      font-weight: 700; margin-bottom: .4rem;
    }
    .popup-title { font-size: 1rem; font-weight: 800; margin-bottom: .3rem; }
    .popup-desc { font-size: .78rem; color: var(--muted); margin-bottom: .75rem; line-height: 1.5; }
    .popup-stats {
      display: flex; gap: 1rem;
      font-family: 'Space Mono', monospace; font-size: .68rem;
      border-top: 1px solid var(--border); padding-top: .6rem;
    }
    .popup-stat-v { font-weight: 700; color: var(--accent); }
    .popup-stat-l { color: var(--muted); }

    .popup-link {
      display: inline-flex; align-items: center; gap: .4rem;
      margin-top: .75rem;
      padding: .4rem .9rem;
      background: linear-gradient(135deg, var(--tiktok-r), var(--tiktok-c));
      border-radius: 999px;
      font-size: .72rem; font-weight: 700; color: #fff;
      text-decoration: none; transition: opacity .2s;
    }
    .popup-link:hover { opacity: .85; }

    /* Custom marker */
    .custom-marker {
      width: 36px; height: 36px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,.15);
      box-shadow: 0 4px 14px rgba(0,0,0,.5);
      transition: transform .2s;
    }
    .custom-marker-inner {
      transform: rotate(45deg);
      font-size: .95rem;
    }

    /* ── MAP CONTROLS OVERLAY ── */
    .map-overlay {
      position: absolute;
      top: 1rem; right: 1rem;
      z-index: 1000;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .overlay-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .75rem 1rem;
      backdrop-filter: blur(10px);
      font-size: .75rem;
    }
    .legend-title {
      font-size: .6rem; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--muted); margin-bottom: .6rem;
    }
    .legend-item {
      display: flex; align-items: center; gap: .5rem; margin-bottom: .3rem;
      font-size: .75rem;
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; }
      #map { height: 50vh; }
      .stats-bar { display: none; }
      .sidebar { height: 50vh; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">▶</div>
    <div class="logo-text">TikTok<span>BSB</span> · Radar</div>
  </div>
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="total-count">8</div>
      <div class="stat-label">Vídeos</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-views">1.2M</div>
      <div class="stat-label">Visualizações</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-locations">8</div>
      <div class="stat-label">Locais</div>
    </div>
  </div>
</header>

<div class="main">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Filtrar vídeos</div>
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="Buscar local ou descrição…"/>
      </div>
    </div>
    <div class="filter-chips">
      <div class="chip all active" data-cat="all">Todos</div>
      <div class="chip food" data-cat="food"><span>Gastronomia</span></div>
      <div class="chip cultura" data-cat="cultura"><span>Cultura</span></div>
      <div class="chip lazer" data-cat="lazer"><span>Lazer</span></div>
      <div class="chip turismo" data-cat="turismo"><span>Turismo</span></div>
    </div>
    <div class="video-list" id="video-list"></div>
  </aside>

  <!-- MAP CONTAINER -->
  <div style="position:relative; flex:1;">
    <div id="map"></div>

    <!-- Legend overlay -->
    <div class="map-overlay">
      <div class="overlay-card">
        <div class="legend-title">Categorias</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Gastronomia</div>
        <div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div>Cultura</div>
        <div class="legend-item"><div class="legend-dot" style="background:#00c3ff"></div>Lazer</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>Turismo</div>
      </div>
    </div>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
// ── DADOS DE EXEMPLO (substitua pela sua API/backend) ──
const videos = [
  {
    id: 1,
    location: "Esplanada dos Ministérios",
    lat: -15.7994, lng: -47.8645,
    category: "turismo",
    description: "Vista aérea impressionante da Esplanada ao nascer do sol 🌅",
    views: "284K", likes: "41K",
    hashtags: "#Brasília #Esplanada #DF",
    url: "#"
  },
  {
    id: 2,
    location: "Pontão do Lago Sul",
    lat: -15.8370, lng: -47.8720,
    category: "lazer",
    description: "Final de semana perfeito no Pontão com food trucks e música ao vivo 🎶",
    views: "156K", likes: "22K",
    hashtags: "#LagoSul #Pontão #BSB",
    url: "#"
  },
  {
    id: 3,
    location: "Feira da Torre",
    lat: -15.7893, lng: -47.8958,
    category: "food",
    description: "Os melhores churros de Brasília estão aqui, sem discussão 🍩",
    views: "98K", likes: "17K",
    hashtags: "#FeiradaTorre #Gastronomia #Brasília",
    url: "#"
  },
  {
    id: 4,
    location: "Museu Nacional",
    lat: -15.7980, lng: -47.8754,
    category: "cultura",
    description: "Exposição nova no Museu Nacional — vale muito a visita! 🎨",
    views: "73K", likes: "9K",
    hashtags: "#MuseuNacional #CulturaBSB #DF",
    url: "#"
  },
  {
    id: 5,
    location: "Parque da Cidade",
    lat: -15.8139, lng: -47.9108,
    category: "lazer",
    description: "Corrida e skate no maior parque urbano do mundo 🛹",
    views: "211K", likes: "33K",
    hashtags: "#ParquedaCidade #BSB #Lazer",
    url: "#"
  },
  {
    id: 6,
    location: "Catedral de Brasília",
    lat: -15.7984, lng: -47.8754,
    category: "turismo",
    description: "A arquitetura da Catedral é simplesmente surreal ✨",
    views: "320K", likes: "58K",
    hashtags: "#Catedral #NiemeyerBSB #Turismo",
    url: "#"
  },
  {
    id: 7,
    location: "Mercado Sul - Taguatinga",
    lat: -15.8401, lng: -48.0467,
    category: "food",
    description: "Rolê pelo Mercado Sul: pastel, caldo de cana e muita história 🥤",
    views: "67K", likes: "11K",
    hashtags: "#Taguatinga #MercadoSul #ComidaDeRua",
    url: "#"
  },
  {
    id: 8,
    location: "Teatro Nacional",
    lat: -15.7972, lng: -47.8837,
    category: "cultura",
    description: "Peça incrível no Teatro Nacional — agenda cultural de BSB tá on 🎭",
    views: "45K", likes: "7K",
    hashtags: "#TeatroNacional #CulturaBSB #Brasília",
    url: "#"
  }
];

// ── MAPA ──
const map = L.map('map', {
  center: [-15.7998, -47.8645],
  zoom: 12,
  zoomControl: true
});

// OpenStreetMap tiles (gratuito)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

// ── CORES POR CATEGORIA ──
const catConfig = {
  food:    { color: '#f97316', emoji: '🍽️' },
  cultura: { color: '#a78bfa', emoji: '🎭' },
  lazer:   { color: '#00c3ff', emoji: '🏄' },
  turismo: { color: '#fbbf24', emoji: '📍' }
};

// ── MARCADORES CUSTOMIZADOS ──
function createIcon(cat) {
  const cfg = catConfig[cat];
  return L.divIcon({
    html: `<div class="custom-marker" style="background:${cfg.color}20;border-color:${cfg.color}">
             <div class="custom-marker-inner">${cfg.emoji}</div>
           </div>`,
    className: '',
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -36]
  });
}

// ── CLUSTER ──
const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 50,
  iconCreateFunction: (cluster) => {
    const count = cluster.getChildCount();
    return L.divIcon({
      html: `<div style="
        background: linear-gradient(135deg, #00f5a0, #00c3ff);
        color: #0a0c10; width:38px; height:38px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        font-weight:800; font-size:.9rem; font-family:'Space Mono',monospace;
        box-shadow:0 0 20px rgba(0,245,160,.4);">${count}</div>`,
      className: '',
      iconSize: [38, 38]
    });
  }
});

// ── POPUP ──
function buildPopup(v) {
  const cfg = catConfig[v.category];
  return `<div class="popup-inner">
    <div class="popup-cat" style="color:${cfg.color}">${cfg.emoji} ${v.category}</div>
    <div class="popup-title">${v.location}</div>
    <div class="popup-desc">${v.description}</div>
    <div style="font-size:.65rem;color:#64748b;margin-bottom:.5rem">${v.hashtags}</div>
    <div class="popup-stats">
      <div><div class="popup-stat-v">${v.views}</div><div class="popup-stat-l">views</div></div>
      <div><div class="popup-stat-v">${v.likes}</div><div class="popup-stat-l">likes</div></div>
    </div>
    <a href="${v.url}" target="_blank" class="popup-link">▶ Ver no TikTok</a>
  </div>`;
}

// ── ESTADO ──
let activeFilter = 'all';
let searchTerm = '';
let markers = {};
let activeCard = null;

function filteredVideos() {
  return videos.filter(v => {
    const matchCat = activeFilter === 'all' || v.category === activeFilter;
    const matchSearch = !searchTerm ||
      v.location.toLowerCase().includes(searchTerm) ||
      v.description.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });
}

function render() {
  // Rebuild markers
  clusterGroup.clearLayers();
  markers = {};
  filteredVideos().forEach(v => {
    const m = L.marker([v.lat, v.lng], { icon: createIcon(v.category) })
      .bindPopup(buildPopup(v), { maxWidth: 280 });
    m.on('click', () => activateCard(v.id));
    markers[v.id] = m;
    clusterGroup.addLayer(m);
  });

  // Rebuild sidebar list
  const list = document.getElementById('video-list');
  list.innerHTML = '';
  filteredVideos().forEach(v => {
    const cfg = catConfig[v.category];
    const card = document.createElement('div');
    card.className = 'video-card' + (activeCard === v.id ? ' active' : '');
    card.style.setProperty('--cat-color', cfg.color);
    card.dataset.id = v.id;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-location">${cfg.emoji} ${v.location}</div>
        <div class="card-cat" style="background:${cfg.color}20;color:${cfg.color}">${v.category}</div>
      </div>
      <div class="card-desc">${v.description}</div>
      <div class="card-meta">
        <span>👁 ${v.views}</span>
        <span>❤️ ${v.likes}</span>
      </div>`;
    card.addEventListener('click', () => {
      activateCard(v.id);
      map.setView([v.lat, v.lng], 15, { animate: true });
      markers[v.id]?.openPopup();
    });
    list.appendChild(card);
  });

  // Update counter
  document.getElementById('total-count').textContent = filteredVideos().length;
}

function activateCard(id) {
  activeCard = id;
  document.querySelectorAll('.video-card').forEach(c => {
    c.classList.toggle('active', Number(c.dataset.id) === id);
  });
}

map.addLayer(clusterGroup);

// ── EVENTOS ──
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.cat;
    render();
  });
});

document.getElementById('search-input').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

// ── INIT ──
render();
</script>
</body>
</html>
