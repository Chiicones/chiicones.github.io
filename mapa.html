<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Eventos — Agenda DF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://chiicones.github.io/theme/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.mapa-wrap { max-width: 100%; padding: 0; }
.mapa-toolbar {
    max-width: 960px;
    margin: 0 auto;
    padding: 1.5rem 2rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
}
.mapa-toolbar h1 {
    font-family: var(--ff-display);
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--ink);
    margin: 0;
}
.mapa-filtros { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.mapa-filtro {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: none;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.15s;
}
.mapa-filtro:hover, .mapa-filtro.ativo {
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
}
#mapa-container {
    width: 100%;
    height: 520px;
    border-top: 1px solid var(--border-light);
    border-bottom: 1px solid var(--border-light);
}
.mapa-lista-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 1.5rem 2rem 3rem;
}
.mapa-lista-titulo {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 1rem;
}
.mapa-lista {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.6rem;
}
.mapa-local {
    padding: 0.6rem 0.85rem;
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.15s;
}
.mapa-local:hover { border-color: var(--gold); color: var(--gold); }
.mapa-local a { color: inherit; text-decoration: none; font-weight: 500; }
.leaflet-popup-content-wrapper {
    border-radius: 2px;
    font-family: var(--ff-body, sans-serif);
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.popup-title {
    font-family: var(--ff-display, serif);
    font-weight: 600;
    font-size: 0.95rem;
    color: #2a2520;
    margin-bottom: 0.35rem;
    line-height: 1.3;
}
.popup-meta { font-size: 0.75rem; color: #6b6259; line-height: 1.6; }
.popup-meta span { display: block; }
.popup-price { color: #b8860b; font-weight: 500; }
.popup-link {
    display: inline-block;
    margin-top: 0.5rem;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #2a2520;
    text-decoration: none;
    border-bottom: 1px solid #2a2520;
}
.popup-link:hover { color: #b8860b; border-color: #b8860b; }
</style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="https://chiicones.github.io/" class="site-logo">
                <span class="logo-mark">✦</span>
                <span class="site-name">Agenda DF</span>
            </a>
            <nav class="main-nav">
                    <a href="/">Eventos</a>
                    <a href="/agenda.html">Agenda</a>
                    <a href="/mapa.html">Mapa</a>
                    <a href="/pages/busca.html">Busca</a>
                    <a href="/blog.html">Blog</a>
                    <a href="/pages/sobre.html">Sobre</a>
            </nav>
        </div>
    </header>

    <main>
<div class="mapa-wrap">
    <div class="mapa-toolbar">
        <h1>Mapa de Eventos</h1>
        <div class="mapa-filtros">
            <button class="mapa-filtro ativo" data-filtro="futuros">Próximos</button>
            <button class="mapa-filtro" data-filtro="todos">Todos</button>
        </div>
    </div>

    <div id="mapa-container"></div>

    <div class="mapa-lista-wrap">
        <p class="mapa-lista-titulo">Locais no mapa</p>
        <div class="mapa-lista" id="mapa-lista"></div>
    </div>
</div>

<script>
const SITEURL = "https://chiicones.github.io";
let mapa, markers = [], todosEventos = [], filtroAtual = 'futuros';

const icone = L.divIcon({
    className: '',
    html: `<svg width="22" height="30" viewBox="0 0 22 30" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="11" cy="28" rx="5" ry="2" fill="rgba(0,0,0,0.15)"/>
        <path d="M11 0C5.477 0 1 4.477 1 10c0 7 10 19 10 19S21 17 21 10C21 4.477 16.523 0 11 0z"
              fill="#2a2520" stroke="#fff" stroke-width="1.5"/>
        <circle cx="11" cy="10" r="4" fill="#c9a84c"/>
    </svg>`,
    iconSize: [22, 30], iconAnchor: [11, 30], popupAnchor: [0, -32]
});

function iniciarMapa() {
    mapa = L.map('mapa-container', { center: [-15.7801, -47.9292], zoom: 11 });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 18
    }).addTo(mapa);
}

function limparMarkers() {
    markers.forEach(m => mapa.removeLayer(m));
    markers = [];
}

function hoje() {
    return new Date().toISOString().slice(0, 10);
}

function slugify(str) {
    return str.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function plotarEventos(eventos) {
    limparMarkers();
    const locaisNoMapa = new Set();

    eventos.forEach(ev => {
        if (!ev.latlng) return;
        const [lat, lng] = ev.latlng;
        const popup = `
            <div class="popup-title">${ev.title}</div>
            <div class="popup-meta">
                <span>📍 ${ev.local}</span>
                ${ev.data ? `<span>🕐 ${ev.data}${ev.horario ? ' · ' + ev.horario : ''}</span>` : ''}
                ${ev.entrada ? `<span class="popup-price">${ev.entrada}</span>` : ''}
            </div>
            <a href="${SITEURL}/${ev.url}" class="popup-link">Ver detalhes →</a>`;
        const m = L.marker([lat, lng], { icon: icone })
            .bindPopup(popup, { maxWidth: 240 }).addTo(mapa);
        markers.push(m);
        locaisNoMapa.add(ev.local);
    });

    const lista = document.getElementById('mapa-lista');
    lista.innerHTML = [...locaisNoMapa].sort().map(local => `
        <div class="mapa-local">
            <a href="${SITEURL}/tag/${slugify(local)}.html">${local}</a>
        </div>`).join('');

    if (markers.length > 0) {
        mapa.fitBounds(L.featureGroup(markers).getBounds().pad(0.15));
    }
}

function aplicarFiltro(filtro) {
    filtroAtual = filtro;
    document.querySelectorAll('.mapa-filtro').forEach(b =>
        b.classList.toggle('ativo', b.dataset.filtro === filtro));
    const h = hoje();
    plotarEventos(filtro === 'futuros'
        ? todosEventos.filter(ev => ev.date_iso >= h)
        : todosEventos);
}

async function carregarEventos() {
    try {
        const res = await fetch(SITEURL + '/search.json');
        todosEventos = await res.json();
        aplicarFiltro(filtroAtual);
    } catch(e) { console.error('Erro ao carregar search.json:', e); }
}

document.querySelectorAll('.mapa-filtro').forEach(btn =>
    btn.addEventListener('click', () => aplicarFiltro(btn.dataset.filtro)));

iniciarMapa();
carregarEventos();
</script>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-logo">✦</span>
            <p>Agenda DF &mdash; Francisco</p>
        </div>
    </footer>

    <script src="https://chiicones.github.io/theme/js/main.js"></script>
</body>
</html>
