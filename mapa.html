<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Eventos — Agenda DF</title>
    <meta name="description" content="Eventos e experiências em Brasília">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://chiicones.github.io/theme/css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="https://chiicones.github.io/" class="site-logo">
                <span class="site-logo__name">Agenda DF</span>
            </a>
            <form class="header-search" action="https://chiicones.github.io/busca.html" method="get">
                <input type="text" name="q" class="header-search__input" placeholder="Buscar eventos...">
                <button type="submit" class="header-search__btn">→</button>
            </form>
        </div>
    </header>

    <main class="site-main">

<div class="taxonomy-header">
    <p class="taxonomy-label">Mapa</p>
    <h1 class="taxonomy-title">Eventos no mapa</h1>
</div>

<section class="mapa-section">
    <div class="mapa-filtros">
        <input type="date" id="filtro-data" class="mapa-date-input">
        <button id="btn-hoje" class="mapa-btn">Hoje</button>
        <button id="btn-limpar" class="mapa-btn mapa-btn--outline">Ver todos</button>
        <span id="mapa-contador" class="mapa-contador"></span>
    </div>
    <div id="mapa"></div>
    <div id="mapa-lista"></div>
</section>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
var SITEURL = 'https://chiicones.github.io';
var allArticles = [];
var markers = [];
var geocodeCache = {};

var map = L.map('mapa').setView([-15.7801, -47.9292], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var icon = L.divIcon({
    className: 'mapa-marker',
    html: '<div class="mapa-marker__dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -10]
});

var COORDS_FIXAS = {
    'espaco infinu': [-15.8344, -47.9131],
    'infinu': [-15.8344, -47.9131],
    'ccbb brasilia': [-15.7956, -47.8823],
    'ccbb': [-15.7956, -47.8823],
    'arena brb': [-15.7833, -47.8997],
    'mane garrincha': [-15.7833, -47.8997],
    'caixa cultural brasilia': [-15.7967, -47.8823],
    'teatro nacional': [-15.7889, -47.9003],
    'parque da cidade': [-15.8089, -47.9267],
    'planetario de brasilia': [-15.7961, -47.8914],
    'zoologico de brasilia': [-15.8728, -47.9456],
    'taguatinga shopping': [-15.8364, -48.0531],
    'patio brasil shopping': [-15.7967, -47.8867],
    'brasilia shopping': [-15.7194, -47.8956],
    'sesc ceilandia': [-15.8228, -48.1067],
    'sesc 504 sul': [-15.8278, -47.9131],
    'sesc setor comercial sul': [-15.7972, -47.8922],
    'clube ascade': [-15.8389, -47.8744],
    'aabb': [-15.8261, -47.8733],
    'birosca do conic': [-15.7972, -47.8922],
    'espelunca': [-15.7972, -47.8922],
    'teatro unip': [-15.8272, -47.9131],
    'recanto das emas': [-15.9083, -48.0636],
    'riacho fundo i': [-15.8767, -48.0197],
    'porks ceilandia': [-15.8228, -48.1067],
    'praca dos estados': [-15.8897, -48.0561],
    'instituto cervantes de brasilia': [-15.8133, -47.9056],
    'ctj hall': [-15.8344, -47.9131],
    'teatro do sesi': [-15.8272, -47.9131],
    'black sheep breja studio': [-15.7339, -47.8914],
    'bar banks': [-15.7339, -47.8914],
    'espaco cultural renato russo': [-15.8278, -47.9131],
    'espaco cultural caesb': [-15.8447, -48.0256],
    'teatro dulcina': [-15.7972, -47.8878],
    'patio brasil': [-15.7967, -47.8867]
};

function buscarCoordsFixas(local) {
    if (!local) return null;
    var key = local.toLowerCase().trim();
    if (COORDS_FIXAS[key]) return COORDS_FIXAS[key];
    var keys = Object.keys(COORDS_FIXAS);
    for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        if (key.indexOf(k) !== -1 || k.indexOf(key) !== -1) return COORDS_FIXAS[k];
    }
    return null;
}

function geocode(local, callback) {
    if (!local) { callback(null); return; }
    var key = local.toLowerCase().trim();
    if (geocodeCache[key]) { callback(geocodeCache[key]); return; }
    var fixas = buscarCoordsFixas(local);
    if (fixas) { geocodeCache[key] = fixas; callback(fixas); return; }
    var query = local + ', Brasilia, DF, Brasil';
    var url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=json&limit=1';
    setTimeout(function() {
        fetch(url, { headers: { 'Accept-Language': 'pt-BR' } })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.length > 0) {
                    var coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                    geocodeCache[key] = coords;
                    callback(coords);
                } else { callback(null); }
            })
            .catch(function() { callback(null); });
    }, 300);
}

function getEventDates(article) {
    return (article.tags || '').split(',')
        .map(function(t) { return t.trim(); })
        .filter(function(t) { return /^\d{2}-\d{2}-\d{4}$/.test(t); });
}

function renderMarkers(filtered) {
    markers.forEach(function(m) { map.removeLayer(m); });
    markers = [];
    document.getElementById('mapa-lista').innerHTML = '';
    document.getElementById('mapa-contador').textContent =
        filtered.length === allArticles.length
            ? filtered.length + ' eventos'
            : filtered.length + ' de ' + allArticles.length + ' eventos';

    filtered.forEach(function(article) {
        geocode(article.local, function(coords) {
            if (!coords) return;
            var popup = '<div class="mapa-popup">' +
                '<span class="mapa-popup__cat">' + article.category + '</span>' +
                '<strong class="mapa-popup__title"><a href="' + SITEURL + '/' + article.url + '">' + article.title + '</a></strong>' +
                (article.local ? '<span class="mapa-popup__local">📍 ' + article.local + '</span>' : '') +
                (article.data ? '<span class="mapa-popup__data">📅 ' + article.data + '</span>' : '') +
                (article.entrada ? '<span class="mapa-popup__entrada">🎟 ' + article.entrada + '</span>' : '') +
                '<a href="' + SITEURL + '/' + article.url + '" class="mapa-popup__link">Ver detalhes →</a></div>';

            var marker = L.marker(coords, { icon: icon }).addTo(map).bindPopup(popup, { maxWidth: 280 });
            markers.push(marker);

            var lista = document.getElementById('mapa-lista');
            var item = document.createElement('div');
            item.className = 'mapa-item';
            item.innerHTML = '<a href="' + SITEURL + '/' + article.url + '" class="mapa-item__title">' + article.title + '</a>' +
                '<span class="mapa-item__meta">' + (article.local || '') + (article.data ? ' · ' + article.data : '') + '</span>';
            item.addEventListener('click', function() { map.setView(coords, 14); marker.openPopup(); });
            lista.appendChild(item);
        });
    });
}

function filtrar() {
    var dataFiltro = document.getElementById('filtro-data').value;
    if (!dataFiltro) { renderMarkers(allArticles); return; }
    var parts = dataFiltro.split('-');
    var tagBusca = parts[2] + '-' + parts[1] + '-' + parts[0];
    var filtered = allArticles.filter(function(a) { return getEventDates(a).indexOf(tagBusca) !== -1; });
    renderMarkers(filtered);
}

fetch(SITEURL + '/search.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        allArticles = data.filter(function(a) { return a.local; });
        renderMarkers(allArticles);
    });

document.getElementById('filtro-data').addEventListener('change', filtrar);
document.getElementById('btn-hoje').addEventListener('click', function() {
    var hoje = new Date();
    var yyyy = hoje.getFullYear();
    var mm = String(hoje.getMonth() + 1).padStart(2, '0');
    var dd = String(hoje.getDate()).padStart(2, '0');
    document.getElementById('filtro-data').value = yyyy + '-' + mm + '-' + dd;
    filtrar();
});
document.getElementById('btn-limpar').addEventListener('click', function() {
    document.getElementById('filtro-data').value = '';
    renderMarkers(allArticles);
});
</script>

    </main>

</body>
